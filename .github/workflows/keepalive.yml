# Supabase free tier pauses a project after ~a week of inactivity and does NOT resume it by
# itself (CLAUDE.md, PROGRESS.md "Ризик №1"). This pings the health endpoint — which does a real
# `SELECT 1` — often enough that the project never goes idle long enough to be paused.
#
# Mitigation B from PROGRESS.md. Mitigation A (open production the day before the demo) stays
# manual on purpose: this cron proves the DB answers, not that the three screens look right.
name: keep-alive

on:
  schedule:
    # 07:00 UTC every second day — well inside the ~7-day idle window, with room for GitHub's
    # scheduled-workflow delays and for a couple of consecutive failures.
    - cron: "0 7 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          set -euo pipefail
          url="${HEALTH_URL:-https://freitty-cabinet.vercel.app/api/health}"
          echo "Pinging $url"
          # Retry: a paused-then-resuming project can need a few seconds on the first hit.
          for attempt in 1 2 3; do
            code=$(curl -fsS -o response.json -w '%{http_code}' --max-time 30 "$url") && break || true
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          cat response.json || true
          echo
          test "${code:-000}" = "200"
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
